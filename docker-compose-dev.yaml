services:
  database:
    image: postgres:16.3-alpine
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - rabelodigital-db:/var/lib/postgresql/data
      - ./dbconfig/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./dbconfig/pg_hba.conf:/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    command: postgres -c listen_addresses='*' -c port=5432
    networks:
      - app-network
  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025
    networks:
      - app-network
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - app-network
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile-dev
  #   ports:
  #     - ${APP_PORT}:${APP_PORT}
  #   volumes:
  #     - .:/usr/src/app

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
      - '5672:5672' # Porta para conexão do RabbitMQ
      - '15672:15672' # UI de gerenciamento do RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - app-network

  # nginx:
  #   restart: always
  #   image: nginx:1-alpine
  #   ports:
  #     - '8089:80'
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  # depends_on:
  #   - api

networks:
  app-network:
    driver: bridge
volumes:
  rabelodigital-db:
